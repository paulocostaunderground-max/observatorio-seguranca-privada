name: Manter Site Streamlit Ativo

on:
  schedule:
    # Executa automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Acordar e manter aplicacao Streamlit ativa
        run: |
          URL="https://vigilante-informado-pt.streamlit.app"
          curl -f -s -S -L -c /tmp/cookies.txt -b /tmp/cookies.txt -A "Mozilla/5.0" "$URL/_stcore/health"
          echo ""
          google-chrome --headless --no-sandbox --disable-gpu --virtual-time-budget=5000 --dump-dom "$URL" > /dev/null 2>&1 || true
          echo "Site verificado e ativo com sucesso!"
