name: Manter Site Streamlit Ativo

on:
  schedule:
    # Executa automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar pagina principal e servidor Streamlit
        run: |
          URL="https://observatorio-seguranca-privada.streamlit.app"
          echo "A contactar: $URL"
          curl -f -s -S -L --retry 3 --retry-delay 5 -A "Mozilla/5.0" "$URL" -o /dev/null
          echo "Pagina principal OK (HTTP 200)"
          curl -f -s -S -L --retry 3 --retry-delay 5 -A "Mozilla/5.0" "$URL/_stcore/health"
          echo ""
          echo "Servidor Streamlit ativo!"
