name: Manter Site Streamlit Ativo

on:
  schedule:
    # Executa automaticamente a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping-streamlit:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar pedido HTTP para manter a app acordada
        env:
          APP_URL: ${{ secrets.STREAMLIT_APP_URL }}
        run: |
          python3 -c '
          import os, urllib.request
          url = os.environ.get("APP_URL", "").strip()
          if not url:
              print("Erro: Secret STREAMLIT_APP_URL nao configurado.")
              exit(1)
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 KeepAliveBot"})
          with urllib.request.urlopen(req, timeout=30) as resp:
              print("Estado HTTP:", resp.status)
          '
